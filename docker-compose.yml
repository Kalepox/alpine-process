services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ap
      POSTGRES_PASSWORD: ap
      POSTGRES_DB: ap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap -d ap"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ap:ap@db:5432/ap
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Optional: Google ADK dev UI (show it to the jury).
  #   docker compose --profile adk up
  adk:
    build: .
    profiles: ["adk"]
    command: adk web --host 0.0.0.0 --port 8001 autopilot/adk_app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ap:ap@db:5432/ap
      DJANGO_SETTINGS_MODULE: backoffice.settings
      PYTHONPATH: /app
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
